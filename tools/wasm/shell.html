<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melee (home netplay)</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --panel2: #1c2230; --line: #2a3140; --text: #e6e9ef;
    --muted: #9aa3b2; --accent: #e8b931; --ok: #5fd38d; --bad: #ff6b6b;
    --p1: #e5484d; --p2: #3e8ef7; --p3: #f5c518; --p4: #30a46c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.playing { overflow: hidden; }
  /* The game draws 4:3 inside a 16:9 surface; fit it whole, letterboxed. The
   * canvas must have no border or padding. */
  #canvas { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important;
    object-fit: contain; background: #000; border: 0; outline: none; display: none; }
  body.playing #canvas { display: block; }
  body.playing #lobby { display: none; }
  #lobby { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .status { color: var(--muted); font-size: 14px; }
  .status.bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .full { grid-column: 1 / -1; }
  .players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 560px) { .players { grid-template-columns: repeat(2, 1fr); } }
  .slot { border-radius: 10px; padding: 10px; background: var(--panel2); border-top: 4px solid var(--line); min-height: 86px; }
  .slot.s0 { border-top-color: var(--p1); } .slot.s1 { border-top-color: var(--p2); }
  .slot.s2 { border-top-color: var(--p3); } .slot.s3 { border-top-color: var(--p4); }
  .slot .who { font-weight: 600; } .slot .what { color: var(--muted); font-size: 13px; }
  .slot.me { outline: 2px solid var(--accent); outline-offset: -2px; }
  .slot.empty { opacity: .45; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: #ffffff14; color: var(--muted); margin-left: 4px; }
  .fighters { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); padding: 8px 10px; }
  button:hover { border-color: #3b4458; }
  button.on { border-color: var(--accent); background: #e8b9311f; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 700; padding: 12px 22px; font-size: 16px; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  label { color: var(--muted); font-size: 13px; }
  input, select { font: inherit; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; }
  input[type=number] { width: 70px; }
  .pad { font-size: 13px; }
  .pad.ok { color: var(--ok); } .pad.no { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 4px; border-bottom: 1px solid #ffffff0d; }
  td:first-child { color: var(--muted); width: 45%; }
  kbd { font: 12px ui-monospace, monospace; background: #0b0d12; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
  #banner { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5; display: none;
    background: #000c; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; gap: 12px; align-items: center; }
  #banner.show { display: flex; }
  #hud { position: fixed; top: 10px; right: 10px; z-index: 3; display: none; gap: 6px; opacity: 0; transition: opacity .3s; }
  body.playing #hud { display: flex; }
  body.playing:hover #hud { opacity: .85; }
  #hud button { padding: 6px 10px; font-size: 13px; background: #000a; }
  #gpu { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--bad); background: #ff6b6b14; font-size: 14px; }
  #gpu.show { display: block; }
  #gpu code { font: 13px ui-monospace, monospace; }
  /* Over the canvas from Start until the match's first frame: the stage
   * load draws nothing but black. */
  #loading { position: fixed; inset: 0; z-index: 4; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: #000;
    transition: opacity .4s; color: var(--muted); font-size: 15px; }
  body.playing #loading { display: flex; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #ffffff1f;
    border-top-color: var(--accent); animation: spin .9s linear infinite; }
  #loading .detail { font-size: 13px; color: #6b7384; min-height: 1.2em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .spin { animation-duration: 3s; } }
  #fps { position: fixed; top: 10px; left: 10px; z-index: 3; display: none; padding: 3px 8px;
    border-radius: 6px; background: #000a; font: 13px ui-monospace, monospace; color: var(--muted); }
  body.playing #fps.show { display: block; }
  #fps.slow { color: var(--bad); }
</style>
<link rel="icon" href="data:,">
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="loading" role="status" aria-live="polite"><div class="spin"></div>
  <div id="loading-text">Loading the match…</div><div class="detail" id="loading-detail"></div></div>
<div id="fps"></div>
<div id="hud"><button id="btn-full">Fullscreen</button><button id="btn-quit">Leave match</button></div>
<div id="banner"><span id="banner-text">Match over.</span><button class="primary" id="btn-lobby">Back to lobby</button></div>

<div id="lobby">
  <header>
    <h1>Super Smash Bros. Melee <span class="tag">home netplay</span></h1>
    <div class="status" id="status">Connecting…</div>
  </header>
  <div id="gpu"></div>

  <div class="grid">
    <section class="card full">
      <h2>Players</h2>
      <div class="players" id="players"></div>
      <div class="row">
        <label>Your name <input id="name" maxlength="16" autocomplete="off"></label>
        <span class="pad no" id="pad">No gamepad yet: plug one in and press a button.</span>
      </div>
    </section>

    <section class="card full">
      <h2>Your fighter</h2>
      <div class="fighters" id="fighters"></div>
      <div class="row"><label>Costume</label><span id="colors"></span></div>
    </section>

    <section class="card">
      <h2>Match <span class="tag" id="host-note"></span></h2>
      <div class="row"><label>Stage</label><select id="stage"></select></div>
      <div class="row">
        <label>Stocks <input type="number" id="stocks" min="1" max="99"></label>
        <label>Minutes <input type="number" id="minutes" min="0" max="99" title="0: no time limit"></label>
      </div>
      <div class="row">
        <label>CPUs <select id="cpus"></select></label>
        <label>Level <select id="cpulevel"></select></label>
      </div>
      <div class="row"><button class="primary" id="btn-start" disabled>Start match</button></div>
    </section>

    <section class="card">
      <h2>Controls</h2>
      <table id="controls"></table>
    </section>
  </div>
</div>

<!-- The lobby is a file, not an inline <script>: the gateway serves this page
     with `script-src 'self' 'wasm-unsafe-eval'`, which blocks inline script.
     Classic (no async/defer) and before emscripten's own tag on purpose: it
     defines `var Module`, which emscripten reads while booting. -->
<script src="lobby.js"></script>
{{{ SCRIPT }}}
</body>
</html>
