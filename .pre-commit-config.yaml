# The one hook that matters here: nothing copied from the retail game may be
# committed. See LEGAL.md. Install it with `pre-commit` from the repo root.
repos:
- repo: local
  hooks:
    - id: no-game-data
      name: no-game-data
      description: refuse to commit anything copied from the retail game
      entry: python tools/pc/check_no_game_data.py
      language: system
      pass_filenames: true

# Upstream's clang-format and style-check hooks are deliberately not here.
# They enforce the decompilation's conventions, and the PC port layer was
# written in its own -- every file under src/port/ and src/pc_stub/ differs
# from the project .clang-format. Enabling them would reformat forty files the
# first time anyone edits one, burying real changes in whitespace.
#
# If you want one style across the tree, do it as a single deliberate commit
# (`pre-commit run clang-format --all-files` with the hook restored), not as a
# side effect of everyone's first edit.
