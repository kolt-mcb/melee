# This repository ships no game data: users supply their own copy of the game.
# The check runs on every push and pull request so a copy of disc content, or a
# rendered frame of the game, cannot land by accident. See LEGAL.md.
name: no-game-data

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit every tracked file
        run: python tools/pc/check_no_game_data.py --all
